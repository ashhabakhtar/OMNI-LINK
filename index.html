<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Link | Neural QR Generator</title>
    <meta name="description" content="A premium, sci-fi themed QR code generator with high-fidelity customization and real-time preview.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>
    
    <main class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="glitch" data-text="OMNI-LINK">OMNI-LINK</span>
            </div>
            <div class="status-bar">
                <span class="status-indicator"></span>
                <span class="status-text">SYSTEM ACTIVE</span>
            </div>
        </header>

        <section class="main-content">
            <!-- Left Side: Control Panel -->
            <div class="panel control-panel">
                <div class="panel-header">
                    <h2><span class="icon">⚡</span> COMMAND CENTER</h2>
                </div>
                
                <div class="input-group">
                    <label for="qr-data">INPUT SOURCE (URL/TEXT)</label>
                    <input type="text" id="qr-data" placeholder="https://your-link.com" autocomplete="off">
                </div>

                <div class="config-grid">
                    <div class="config-section">
                        <h3>VISUALS</h3>
                        <div class="field">
                            <label>DOT COLOR</label>
                            <input type="color" id="dot-color" value="#00f2ff">
                        </div>
                        <div class="field">
                            <label>BG COLOR</label>
                            <input type="color" id="bg-color" value="#0a0a12">
                        </div>
                    </div>

                    <div class="config-section">
                        <h3>GEOMETRY</h3>
                        <div class="field">
                            <label>DOT TYPE</label>
                            <select id="dot-type">
                                <option value="rounded">Rounded</option>
                                <option value="dots">Dots</option>
                                <option value="classy">Classy</option>
                                <option value="square" selected>Square</option>
                                <option value="extra-rounded">Extra Rounded</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>CORNERS</label>
                            <select id="corner-type">
                                <option value="square">Square</option>
                                <option value="extra-rounded" selected>Extra Rounded</option>
                                <option value="dot">Dot</option>
                            </select>
                        </div>
                    </div>

                    <div class="config-section logo-section">
                        <h3>IDENTITY</h3>
                        <div class="field">
                            <label>CENTER LOGO</label>
                            <input type="file" id="logo-input" accept="image/*">
                            <button class="btn-secondary" onclick="document.getElementById('logo-input').click()">UPLOAD</button>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button id="download-png" class="btn-primary">EXPORT PNG</button>
                    <button id="download-svg" class="btn-secondary">EXPORT SVG</button>
                </div>
            </div>

            <!-- Right Side: Visualization -->
            <div class="panel preview-panel">
                <div class="panel-header">
                    <h2><span class="icon">👁️</span> VISUALIZATION CHAMBER</h2>
                </div>
                <div class="qr-wrapper">
                    <div id="qr-canvas" class="qr-canvas"></div>
                    <div class="scan-line"></div>
                </div>
                <div class="meta-info">
                    <div class="meta-item">
                        <span class="label">RESOLUTION:</span>
                        <span class="value">1024x1024</span>
                    </div>
                    <div class="meta-item">
                        <span class="label">ENCRYPTION:</span>
                        <span class="value">ECC-H</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2024 NEURAL-LINK INTERFACE // SECURE_GEN_v1.0</p>
    </footer>

    <!-- QR Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
    <script src="script.js"></script>
</body>
</html>
